  <text x="825" y="185" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="22">16 / 16 wins</text>
  <text x="610" y="245" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="22" font-weight="700">MMLU</text>
  <text x="825" y="245" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="22">16 / 16 wins</text>
