<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">OW-L beats majority voting in 47 of 48 published ensemble cases</title>
  <desc id="desc">A grid shows 47 wins and one non-win, split as 16 of 16 on UltraFeedback, 16 of 16 on MMLU, and 15 of 16 on ARMMAN.</desc>
  <rect width="1200" height="600" fill="#0b1020"/>
  <text x="70" y="65" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="32" font-weight="700">47 / 48 published cases favor OW-L over majority voting</text>
  <text x="70" y="103" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="18">Exact arithmetic reconstruction of Appendix Tables 4–6 · 97.92%</text>
  <g fill="#34d399">
