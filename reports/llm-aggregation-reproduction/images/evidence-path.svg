<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Evidence path from exact paper statement to verdict</title>
  <desc id="desc">The reproduction connects source hashes to contracts, executable verifiers, independent checks, controls, and evaluator-visible pages.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="70" y="62" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#0f172a">What turned a 0/12 summary into checkable evidence</text>
  <g font-family="system-ui,sans-serif">
    <rect x="60" y="135" width="190" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="155" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">1 · Source</text>
    <text x="155" y="213" text-anchor="middle" font-size="16" fill="#075985">hash + anchors</text>
    <rect x="290" y="135" width="190" height="110" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="385" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#5b21b6">2 · Contract</text>
    <text x="385" y="213" text-anchor="middle" font-size="16" fill="#5b21b6">domain + quantifier</text>
    <rect x="520" y="135" width="190" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="615" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">3 · Verifier</text>
    <text x="615" y="213" text-anchor="middle" font-size="16" fill="#166534">nonzero on failure</text>
    <rect x="750" y="135" width="190" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="845" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#92400e">4 · Challenge</text>
    <text x="845" y="207" text-anchor="middle" font-size="15" fill="#92400e">independent checker</text>
    <text x="845" y="228" text-anchor="middle" font-size="15" fill="#92400e">+ negative control</text>
    <rect x="980" y="135" width="170" height="110" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="1065" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">5 · Surface</text>
    <text x="1065" y="207" text-anchor="middle" font-size="15" fill="#334155">inline result</text>
    <text x="1065" y="228" text-anchor="middle" font-size="15" fill="#334155">+ raw links</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none">
    <path d="M250 190 H285"/><path d="M480 190 H515"/><path d="M710 190 H745"/><path d="M940 190 H975"/>
  </g>
  <g fill="#64748b">
    <path d="M285 190 l-10 -7 v14z"/><path d="M515 190 l-10 -7 v14z"/><path d="M745 190 l-10 -7 v14z"/><path d="M975 190 l-10 -7 v14z"/>
  </g>
  <rect x="100" y="330" width="470" height="112" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="335" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#065f46">VERIFIED × 5</text>
  <text x="335" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#047857">proof certificates, exact tables, or calibrated full-scale simulation</text>
  <rect x="630" y="330" width="470" height="112" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="865" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#92400e">BLOCKED × 1</text>
  <text x="865" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#b45309">four routes exhausted; concrete external unblocker recorded</text>
</svg>
